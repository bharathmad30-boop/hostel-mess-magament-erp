<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostel Mess ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#1c2a23;--mute:#5d6b63;--line:#d9dfd9;--pri:#1f5c43;--onpri:#fff;--acc:#e3a008;--bad:#b3392b;--ok:#1f7a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--ink:#e8eee9;--mute:#9db0a5;--line:#2f3f36;--pri:#5fc08f;--onpri:#0e1a13;--acc:#f0b429;--bad:#f07a6a;--ok:#6fd49b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--ink:#e8eee9;--mute:#9db0a5;--line:#2f3f36;--pri:#5fc08f;--onpri:#0e1a13;--acc:#f0b429;--bad:#f07a6a;--ok:#6fd49b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Familjen Grotesk',system-ui,sans-serif}
header{background:var(--pri);color:var(--onpri);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header select,header button{font:inherit}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:22px}h3{margin:20px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.box b{display:block;font-size:24px}.box span{color:var(--mute);font-size:13px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:13px;color:var(--mute)}
td.n,th.n{text-align:right}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);max-width:100%}
button.b{font:inherit;background:var(--pri);color:var(--onpri);border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
button.g{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}.row label{display:grid;gap:2px;font-size:13px;color:var(--mute)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.note{background:var(--card);border-left:4px solid var(--acc);padding:8px 12px;margin:8px 0;font-size:14px}
.bar{height:14px;background:var(--pri);border-radius:2px;min-width:2px}
.login{max-width:520px;margin:10vh auto;padding:16px}.login button{display:block;width:100%;margin:8px 0;text-align:left;padding:14px;font-size:16px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.hero{background:var(--pri);color:var(--onpri);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}.hero h1{font-size:40px;line-height:1.1;margin:0}.hero p{margin:0;max-width:44ch;opacity:.9}.hero ul{margin:8px 0 0;padding-left:18px;line-height:1.9}
.lform{display:grid;align-content:center;padding:48px;max-width:460px;margin:auto;gap:10px;width:100%}.lform h2{margin:0}.lform label{display:grid;gap:3px;font-size:13px;color:var(--mute)}.lform input{padding:11px}.lform .b{padding:12px;font-size:16px;margin-top:6px}.hint{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--pri);color:var(--onpri);display:flex;flex-direction:column;gap:2px;padding:16px 10px;position:sticky;top:0;height:100vh}.brand{font-weight:700;font-size:19px;padding:4px 12px 16px}.side button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer;opacity:.85}.side button.on{background:#ffffff2e;opacity:1;font-weight:700}.who{margin-top:auto;padding:10px 12px;font-size:13px;display:grid;gap:8px}.who .g{color:inherit;border-color:#ffffff66}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}.top strong{font-size:16px}
@media(max-width:760px){.auth,.shell{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:28px}.lform{padding:24px}.side{flex-direction:row;overflow-x:auto;position:static;height:auto;padding:8px}.brand,.who{display:none}.side button{white-space:nowrap}}
@media print{.side,.top,.np{display:none!important}.shell{display:block}}
</style></head><body>
<div id="app"></div>
<script>
const MON='2026-09',MONL='September 2026';
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,me=null,tab='',viewH='M',toast='',KEY='mess-erp-v3';
function seed(){
 const MN=['Arun Kumar','Karthik R','Vignesh S','Naveen P','Suresh M','Harish T','Dinesh K','Manoj V','Praveen G','Ramesh B','Gokul N','Sathish A','Bala Murugan','Ajith R','Vishnu P'],WN=['Sneha R','Divya B','Meena K','Anitha S','Priya Lakshmi','Kavya R','Lavanya M','Nithya P','Pooja V','Revathi G','Swathi K','Janani T','Deepa N','Keerthana S','Harini B'];
 const BY=[2021,2021,2021,2022,2022,2022,2023,2023,2023,2024,2024,2025,2025,2026,2026],students=[];['M','W'].forEach((h,hi)=>(hi?WN:MN).forEach((n,j)=>students.push({id:h+BY[j]+String(j-BY.indexOf(BY[j])+1).padStart(2,'0'),name:n,h,grp:'Batch '+BY[j],arrears:students.length%3==1?300:0,paid:{bill:0,fine:0,old:0},fineLock:null})));
 const menu=[];['M','W'].forEach(h=>[['Egg omelette','Breakfast',20,'1 pc'],['Chicken curry','Lunch',60,'1 bowl'],['Paneer gravy','Dinner',50,'1 bowl'],['Fruit salad','Dinner',30,'1 cup'],['Curd','Lunch',15,'1 cup']].forEach((m,i)=>menu.push({id:h+i,h,name:m[0],meal:m[1],rate:m[2],unit:m[3]})));
 const orders=[];let k=1;
 students.forEach((s,i)=>{for(let d=1;d<=6;d++){const m=menu.filter(x=>x.h==s.h)[(i+d)%5];orders.push({id:k++,sid:s.id,mid:m.id,item:m.name,qty:1+(d%2),rate:m.rate,date:MON+'-'+String(d*4).padStart(2,'0'),by:'Seed',cancelled:false,reason:''})}});
 const stock=[];['M','W'].forEach(h=>[['Eggs','pcs',200],['Chicken','kg',30],['Paneer','kg',15]].forEach((x,i)=>stock.push({id:h+'s'+i,h,name:x[0],unit:x[1],open:x[2],rec:0,used:0,adj:0,cost:0})));
 return{students,menu,orders,stock,pays:[],audit:[],asof:'2026-10-20',nid:k,npay:1}
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.students)S=seed();
S.cn=S.cn||{M:{open:false},W:{open:false}};S.sess=S.sess||[];{const d=new Date();S.asof=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let sel=null,qry='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function log(a){S.audit.unshift({t:new Date().toLocaleString('en-IN'),who:me?me.label:'-',a});save()}
function fineCalc(){const d=+S.asof.slice(8)-0,ym=S.asof.slice(0,7);if(ym<'2026-10')return 0;const late=Math.min(d,31)-15;if(late<=0&&ym==='2026-10')return 0;const L=ym==='2026-10'?late:16;return Math.min(L,7)*25+Math.max(L-7,0)*50}
function stm(s){
 const bill=S.orders.filter(o=>o.sid==s.id&&!o.cancelled).reduce((a,o)=>a+o.qty*o.rate,0);
 const billRem=bill-s.paid.bill;
 const fine=s.fineLock!==null?s.fineLock:(billRem>0?fineCalc():0);
 const fineRem=fine-s.paid.fine,oldRem=s.arrears-s.paid.old;
 const total=billRem+fineRem+oldRem;
 let cat=total<=0?'Fully settled':(billRem<=0&&fineRem<=0&&oldRem>0)?'Bill and fine paid, old dues remaining':billRem<=0?'Current bill paid only':'Partial or no payment';
 return{bill,billRem,fine,fineRem,old:s.arrears,oldRem,total,cat}}
const hs=h=>S.students.filter(s=>s.h==h);
const HN={M:"Men’s hostel",W:"Women’s hostel"};
function go(u){me=u;viewH=u.home||'M';tab=u.role=='admin'?'Dashboard':u.role=='student'?'Statement':'Reports';draw()}
function tabs(){return me.role=='admin'?['Dashboard','Counter','Students','Menu','Stock','Billing','Reconciliation','Reports','Rules','Audit','Settings']:me.role=='student'?['Statement','Payments']:['Reports']}
const dis=ro=>ro?'disabled':'';
const V={
Dashboard(){
 const st=hs(viewH),ids=st.map(s=>s.id),ord=S.orders.filter(o=>ids.includes(o.sid)&&!o.cancelled);
 const tot=ord.reduce((a,o)=>a+o.qty*o.rate,0),canc=S.orders.filter(o=>ids.includes(o.sid)&&o.cancelled).length;
 const due=st.reduce((a,s)=>a+Math.max(stm(s).total,0),0),col=st.reduce((a,s)=>a+s.paid.bill+s.paid.fine+s.paid.old,0);
 const by={};ord.forEach(o=>by[o.item]=(by[o.item]||0)+o.qty);
 const low=S.stock.filter(x=>x.h==viewH&&stockLeft(x)<20);
 return`<h2>Dashboard</h2><div class="grid"><div class="box"><b>${st.length}</b><span>Students</span></div><div class="box"><b>${money(tot)}</b><span>Extras billed</span></div><div class="box"><b>${money(col)}</b><span>Collected</span></div><div class="box"><b>${money(due)}</b><span>Outstanding</span></div><div class="box"><b>${canc}</b><span>Cancelled orders</span></div></div>
 <h3>Item-wise order totals</h3><div class="wrap"><table><tr><th>Item</th><th class="n">Quantity</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')||'<tr><td colspan=2 class="mute">No orders yet.</td></tr>'}</table></div>
 <h3>Low stock</h3>${low.length?low.map(x=>`<span class="tag bad">${x.name}: ${stockLeft(x)} ${x.unit}</span> `).join(''):'<span class="mute">All items above the minimum level.</span>'}`},
Orders(ro){
 const st=hs(viewH),mn=S.menu.filter(m=>m.h==viewH),ids=st.map(s=>s.id);
 const list=S.orders.filter(o=>ids.includes(o.sid)).slice().reverse().slice(0,40);
 return`<h2>Daily extras orders</h2><div class="note">Orders dated in ${MONL} go on the current statement. Orders with later dates are kept for the next month’s statement.</div>${S.cn[viewH].open?'':'<div class="note bad">Counter is closed. Start it from the Counter tab to record orders.</div>'}<div class="row np"><label>Student<select id="os">${st.map(s=>`<option value="${s.id}">${s.id} ${esc(s.name)}</option>`).join('')}</select></label>
 <label>Item<select id="oi">${mn.map(m=>`<option value="${m.id}">${m.meal}: ${esc(m.name)} (${money(m.rate)}/${m.unit})</option>`).join('')}</select></label>
 <label>Quantity<input id="oq" type="number" min="1" value="1" style="width:80px"></label><label>Date (automatic)<input id="od" type="date" value="${S.asof}" readonly></label>
 <button class="b" ${dis(ro)} onclick="addOrder()">Record order</button></div>
 <div class="row np"><label>Cancellation reason<input id="cr" placeholder="Required to cancel"></label><label>Reassign to (optional)<select id="cx"><option value="">Do not reassign</option>${st.map(s=>`<option value="${s.id}">${s.id} ${esc(s.name)}</option>`).join('')}</select></label></div>
 <div class="wrap"><table><tr><th>Date &amp; time</th><th>Student</th><th>Item</th><th class="n">Qty</th><th class="n">Total</th><th>Recorded by</th><th>Status</th></tr>
 ${list.map(o=>`<tr><td>${o.date} ${o.time||''}</td><td>${o.sid}</td><td>${esc(o.item)}</td><td class="n">${o.qty}</td><td class="n">${money(o.qty*o.rate)}</td><td>${esc(o.by)}${o.sess?'<br><span class="mute">'+sl(o.sess)+'</span>':''}</td><td>${o.cancelled?`<span class="bad">Cancelled: ${esc(o.reason)}</span><br><span class="mute">${esc(o.cby||'')} ${o.cat||''}${o.reassigned?' · reassigned to '+o.reassigned:''}</span>`:`<button class="g" ${dis(ro)} onclick="cancelOrder(${o.id})">Cancel</button>`}</td></tr>`).join('')}</table></div>`},
Students(ro){
 return`<h2>Students</h2><div class="row np"><label>Full name<input id="sn"></label><button class="b" ${dis(ro)} onclick="addStudent()">Register student</button></div>
 <div class="wrap"><table><tr><th>ID</th><th>Name</th><th>Hostel</th><th class="n">Old dues</th></tr>${hs(viewH).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${HN[s.h]}</td><td class="n">${money(s.arrears)}</td></tr>`).join('')}</table></div>`},
Menu(ro){
 return`<h2>Menu and prices</h2><div class="row np"><label>Item<input id="mn"></label><label>Meal<select id="mm"><option>Breakfast</option><option>Lunch</option><option>Dinner</option></select></label><label>Rate (₹)<input id="mr" type="number" min="1" style="width:90px"></label><label>Unit<input id="mu" value="1 plate" style="width:100px"></label><button class="b" ${dis(ro)} onclick="addMenu()">Add item</button></div>
 <div class="wrap"><table><tr><th>Meal</th><th>Item</th><th>Unit</th><th class="n">Rate</th></tr>${S.menu.filter(m=>m.h==viewH).sort((a,b)=>a.meal<b.meal?-1:1).map(m=>`<tr><td>${m.meal}</td><td>${esc(m.name)}</td><td>${m.unit}</td><td class="n"><input type="number" min="1" value="${m.rate}" style="width:80px" ${dis(ro)} onchange="setRate('${m.id}',this.value)"></td></tr>`).join('')}</table></div>`},
Stock(ro){
 const it=S.stock.filter(x=>x.h==viewH);
 return`<h2>Stock and purchases</h2><div class="row np"><label>Item<select id="si">${it.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label><label>Movement<select id="st"><option value="rec">Received</option><option value="used">Used</option><option value="adj">Adjustment (+/−)</option></select></label><label>Quantity<input id="sq" type="number" style="width:90px"></label><label>Cost (₹, if received)<input id="sc" type="number" min="0" style="width:110px"></label><label>Supplier<input id="sp" style="width:130px"></label><button class="b" ${dis(ro)} onclick="moveStock()">Record</button></div>
 <div class="wrap"><table><tr><th>Item</th><th class="n">Opening</th><th class="n">Received</th><th class="n">Used</th><th class="n">Adjusted</th><th class="n">Closing</th><th class="n">Spend</th></tr>${it.map(x=>`<tr><td>${x.name} (${x.unit})</td><td class="n">${x.open}</td><td class="n">${x.rec}</td><td class="n">${x.used}</td><td class="n">${x.adj}</td><td class="n"><b>${stockLeft(x)}</b></td><td class="n">${money(x.cost)}</td></tr>`).join('')}</table></div>`},
Billing(){
 return`<h2>Billing, ${MONL} extras</h2><div class="note">Statement published 1 Oct, due 15 Oct. Fine: ₹25/day for the first 7 late days, ₹50/day after, stopping at month-end. Confirm these rules with the hostel council before official use.</div>
 <div class="wrap"><table><tr><th>Student</th><th class="n">Bill</th><th class="n">Old dues</th><th class="n">Fine</th><th class="n">Paid</th><th class="n">Remaining</th><th>Status</th></tr>${hs(viewH).map(s=>{const t=stm(s);return`<tr><td>${s.id} ${esc(s.name)}</td><td class="n">${money(t.bill)}</td><td class="n">${money(t.old)}</td><td class="n">${money(t.fine)}</td><td class="n">${money(s.paid.bill+s.paid.fine+s.paid.old)}</td><td class="n"><b>${money(t.total)}</b></td><td>${t.cat}</td></tr>`}).join('')}</table></div>`},
Reports(){
 const hl=me.role=='admin'?[viewH]:['M','W'];let out='<h2>Council payment-status report</h2><div class="np row"><button class="b" onclick="try{window.print()}catch(e){}">Print or save as PDF</button></div>';
 hl.forEach(h=>{const st=hs(h),c={};st.forEach(s=>{const k=stm(s).cat;(c[k]=c[k]||[]).push(s)});
  out+=`<h3>${HN[h]}</h3><div class="wrap"><table><tr><th>Category</th><th class="n">Students</th><th>Names</th></tr>${['Fully settled','Current bill paid only','Bill and fine paid, old dues remaining','Partial or no payment'].map(k=>`<tr><td>${k}</td><td class="n">${(c[k]||[]).length}</td><td>${(c[k]||[]).map(s=>esc(s.name)).join(', ')||'-'}</td></tr>`).join('')}</table></div>`;
  const ex=S.stock.filter(x=>x.h==h),mx=Math.max(1,...ex.map(x=>x.cost));
  out+=`<h3>Monthly expense summary</h3><div class="wrap"><table>${ex.map(x=>`<tr><td>${x.name}</td><td style="width:60%"><div class="bar" style="width:${x.cost/mx*100}%"></div></td><td class="n">${money(x.cost)}</td></tr>`).join('')}</table></div>`});
 return out},
Audit(){return`<h2>Audit log</h2><div class="wrap"><table><tr><th>Time</th><th>User</th><th>Action</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${esc(a.who)}</td><td>${esc(a.a)}</td></tr>`).join('')||'<tr><td colspan=3 class="mute">No events yet.</td></tr>'}</table></div>`},
Statement(){
 const s=S.students.find(x=>x.id==me.id),t=stm(s);
 return`<h2>${esc(s.name)} · ${MONL} statement</h2><div id="print-area"><div class="grid"><div class="box"><b>${money(t.bill)}</b><span>Current bill</span></div><div class="box"><b>${money(t.old)}</b><span>Previous dues</span></div><div class="box"><b>${money(t.fine)}</b><span>Late fine</span></div><div class="box"><b>${money(t.total)}</b><span>Remaining balance</span></div></div>
 <h3>Orders</h3><div class="wrap"><table><tr><th>Date &amp; time</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Total</th></tr>${S.orders.filter(o=>o.sid==s.id&&!o.cancelled).map(o=>`<tr><td>${o.date} ${o.time||''}</td><td>${esc(o.item)}</td><td class="n">${o.qty}</td><td class="n">${money(o.rate)}</td><td class="n">${money(o.qty*o.rate)}</td></tr>`).join('')}</table></div></div>
 <div class="row np"><button class="b" onclick="try{window.print()}catch(e){}">Download statement (PDF)</button></div>`},
Payments(){
 const s=S.students.find(x=>x.id==me.id),t=stm(s),mine=S.pays.filter(p=>p.sid==s.id).slice().reverse();
 const comp=[['bill','Current bill',t.billRem],['fine','Late fine',t.fineRem],['old','Previous dues',t.oldRem]];
 return`<h2>Pay online</h2><div class="note">Tick the parts you want to pay and edit the amount for a partial payment. Payment is confirmed by the provider before a receipt is issued.</div>
 <div class="wrap"><table>${comp.map(c=>`<tr><td><input type="checkbox" id="c_${c[0]}" ${c[2]>0?'':'disabled'}> ${c[1]}</td><td class="n">Due ${money(Math.max(c[2],0))}</td><td><input type="number" min="0" max="${Math.max(c[2],0)}" id="a_${c[0]}" value="${Math.max(c[2],0)}" style="width:100px"></td></tr>`).join('')}</table></div>
 <div class="row"><button class="b" onclick="startPay()" ${t.total>0?'':'disabled'}>Start payment</button></div>
 <h3>Payment history</h3><div class="wrap"><table><tr><th>Reference</th><th>Time</th><th class="n">Amount</th><th>Status</th><th></th></tr>${mine.map(p=>`<tr><td>${p.ref}</td><td>${p.ts}</td><td class="n">${money(p.amt)}</td><td>${p.status}</td><td>${p.status=='pending'?`<button class="g" onclick="confirmPay('${p.ref}',true)">Provider confirms</button> <button class="g" onclick="confirmPay('${p.ref}',false)">Provider fails</button>`:p.status=='success'?`<button class="g" onclick="receipt('${p.ref}')">Receipt</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="mute">No payments yet.</td></tr>'}</table></div>`}
};
function addOrder(){if(!S.cn[viewH].open)return flash('Counter is closed. Start the counter first.');const q=+oq.value;if(!(q>0)||!od.value)return flash('Enter a valid quantity and date.');const m=S.menu.find(x=>x.id==oi.value);S.orders.push({id:S.nid++,sid:os.value,mid:m.id,item:m.name,qty:q,rate:m.rate,date:od.value,time:new Date().toLocaleTimeString('en-IN'),by:me.label,sess:S.cn[viewH].id,cancelled:false,reason:''});log(`Order: ${os.value} ${m.name} x${q}`);flash('Order recorded.')}

function bfIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function bfDay(n){const d=new Date(S.asof+'T00:00:00');d.setDate(d.getDate()-n);return bfIso(d)}
function bfStep(n){const d=new Date((bfDate||S.asof)+'T00:00:00');d.setDate(d.getDate()+n);bfDate=bfIso(d);bfLimit=20;draw()}
function bfBlock(){
 const ids=hs(viewH).map(s=>s.id),q=bfQ.trim().toLowerCase(),g={},z=()=>({q:0,a:0}),sum={Eggs:z(),Chicken:z(),Paneer:z()},sh={Morning:z(),Night:z()};
 S.orders.forEach(o=>{if(o.cancelled||!ids.includes(o.sid)||(bfDate&&o.date!==bfDate))return;if(!catOf(o.item))return;const sf=shiftOf(o);if(bfShift!='All'&&sf!=bfShift)return;const s=S.students.find(x=>x.id==o.sid);if(q&&!(o.sid+' '+s.name+' '+roomOf(s)).toLowerCase().includes(q))return;
  const c=catOf(o.item),a=o.qty*o.rate,k=o.date+'|'+o.sid+'|'+sf,r=g[k]=g[k]||{date:o.date,sid:o.sid,sf,time:'',Eggs:z(),Chicken:z(),Paneer:z()};
  r[c].q+=o.qty;r[c].a+=a;if(o.time)r.time=o.time;sum[c].q+=o.qty;sum[c].a+=a;sh[sf].q+=o.qty;sh[sf].a+=a});
 const rows=Object.values(g).sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:x.sid<y.sid?-1:1),tq=sum.Eggs.q+sum.Chicken.q+sum.Paneer.q,ta=sum.Eggs.a+sum.Chicken.a+sum.Paneer.a;
 const box=(l,v,n)=>`<div class="box"><span>${l}</span><b>${v}</b><span>${n}</span></div>`,cell=c=>c.q?`<b>${c.q}</b> <span class="mute">${money(c.a)}</span>`:'<span class="mute">-</span>';
 const sec=(name,note)=>{if(bfShift!='All'&&bfShift!=name)return'';const rs=rows.filter(r=>r.sf==name),t={Eggs:z(),Chicken:z(),Paneer:z()};rs.forEach(r=>['Eggs','Chicken','Paneer'].forEach(c=>{t[c].q+=r[c].q;t[c].a+=r[c].a}));
  const tn=t.Eggs.q+t.Chicken.q+t.Paneer.q,tm=t.Eggs.a+t.Chicken.a+t.Paneer.a;
  return`<h3>${name} extras <span class="mute" style="font-weight:400">· ${note}</span></h3><div class="wrap"><table><tr><th>Date &amp; time</th><th>Student details</th><th>Eggs (qty · ₹)</th><th>Chicken (qty · ₹)</th><th>Paneer (qty · ₹)</th><th class="n">Total (items · ₹)</th></tr>${rs.slice(0,bfLimit).map(r=>{const n=r.Eggs.q+r.Chicken.q+r.Paneer.q,m=r.Eggs.a+r.Chicken.a+r.Paneer.a;return`<tr><td>${r.date}${r.time?'<br><span class="mute">'+r.time+'</span>':''}</td><td>${sinfo(r.sid)}</td><td>${cell(r.Eggs)}</td><td>${cell(r.Chicken)}</td><td>${cell(r.Paneer)}</td><td class="n"><b>${n}</b> · ${money(m)}</td></tr>`}).join('')||'<tr><td colspan=6 class="mute">No extras in this shift.</td></tr>'}<tr><td colspan=2><b>${name} total</b></td><td>${cell(t.Eggs)}</td><td>${cell(t.Chicken)}</td><td>${cell(t.Paneer)}</td><td class="n"><b>${tn}</b> · <b>${money(tm)}</b></td></tr></table></div>${rs.length>bfLimit?`<div class="row np" style="justify-content:center"><span class="mute">Showing ${bfLimit} of ${rs.length} rows</span><button class="g" onclick="bfLimit+=20;bfRefresh()">Show more</button></div>`:''}`};
 const sm={};rows.forEach(r=>{const e=sm[r.sid]=sm[r.sid]||{sid:r.sid,n:0,a:0};e.n+=r.Eggs.q+r.Chicken.q+r.Paneer.q;e.a+=r.Eggs.a+r.Chicken.a+r.Paneer.a});const sl=Object.values(sm).sort((x,y)=>y.a-x.a);
 const stuTab=()=>`<h3>Students and amount · ${bfDate||'all dates'}</h3><div class="wrap"><table><tr><th>Student details</th><th class="n">Items</th><th class="n">Amount</th></tr>${sl.map(e=>`<tr><td>${sinfo(e.sid)}</td><td class="n">${e.n}</td><td class="n"><b>${money(e.a)}</b></td></tr>`).join('')||'<tr><td colspan=3 class="mute">No extras on this date.</td></tr>'}<tr><td><b>Total · ${sl.length} students</b></td><td class="n"><b>${tq}</b></td><td class="n"><b>${money(ta)}</b></td></tr></table></div>`;
 const tdO=S.orders.filter(o=>!o.cancelled&&ids.includes(o.sid)&&o.date==S.asof&&catOf(o.item)),tdA=tdO.reduce((a,o)=>a+o.qty*o.rate,0),tdQ=tdO.reduce((a,o)=>a+o.qty,0);
 const dayTab=()=>{if(bfDate)return'';const m={};Object.values(g).forEach(r=>{const d=m[r.date]=m[r.date]||{date:r.date,Eggs:z(),Chicken:z(),Paneer:z(),time:''};['Eggs','Chicken','Paneer'].forEach(c=>{d[c].q+=r[c].q;d[c].a+=r[c].a});if(r.time)d.time=r.time});const ds=Object.values(m).sort((x,y)=>x.date<y.date?1:-1);if(!ds.length)return'';return`<h3>Day-wise extras</h3><div class="wrap"><table><tr><th>Date</th><th>Last update</th><th>Eggs (qty · ₹)</th><th>Chicken (qty · ₹)</th><th>Paneer (qty · ₹)</th><th class="n">Total (items · ₹)</th><th class="np"></th></tr>${ds.map(d=>{const n=d.Eggs.q+d.Chicken.q+d.Paneer.q,a=d.Eggs.a+d.Chicken.a+d.Paneer.a;return`<tr><td><b>${d.date}</b>${d.date==S.asof?' <span class="tag">Today</span>':''}</td><td>${d.time||'-'}</td><td>${cell(d.Eggs)}</td><td>${cell(d.Chicken)}</td><td>${cell(d.Paneer)}</td><td class="n"><b>${n}</b> · ${money(a)}</td><td class="np"><button class="g" onclick="bfDate='${d.date}';bfLimit=20;draw()">View day</button></td></tr>`}).join('')}</table></div>`};
 return`<div class="grid">${box('Today’s amount · '+S.asof,money(tdA),tdQ+' items today')}${box('Amount · '+(bfDate||'all dates')+(q?' · searched students':''),money(ta),tq+' items given')}${box('Eggs',money(sum.Eggs.a),sum.Eggs.q+' given')}${box('Chicken',money(sum.Chicken.a),sum.Chicken.q+' given')}${box('Paneer',money(sum.Paneer.a),sum.Paneer.q+' given')}${box('Students',sl.length,'bought extras')}</div>${stuTab()}${sec('Morning','breakfast and lunch')}${sec('Night','dinner')}`}
function bfRefresh(){document.getElementById('bfres').innerHTML=bfBlock()}
const _bill=V.Billing;
V.Billing=function(ro){if(!bfDate)bfDate=S.asof;return`<h2>Billing · Extras breakdown</h2><div class="note">Eggs, chicken and paneer given to students, with Morning (breakfast and lunch) and Night (dinner) shown separately. Curd and fruit salad are not listed here but stay on the student bills. Every extra bought updates these quantities straight away.</div><div class="row np"><button class="g" onclick="bfStep(-1)">‹ Previous day</button><button class="g" onclick="bfStep(1)">Next day ›</button><label>Date<input type="date" value="${bfDate}" onchange="bfDate=this.value;bfLimit=20;draw()"></label><label>Shift<select onchange="bfShift=this.value;bfRefresh()">${['All','Morning','Night'].map(x=>`<option ${x==bfShift?'selected':''}>${x}</option>`).join('')}</select></label><label>Search student<input type="search" value="${esc(bfQ)}" oninput="bfQ=this.value;bfRefresh()" placeholder="ID, name or room" style="width:200px"></label></div><div id="bfres">${bfBlock()}</div>`+_bill(ro).replace('<h2>','<h3 style="margin-top:28px">').replace('</h2>','</h3>')};
const _sd6=sDetail;
sDetail=function(){const s=S.students.find(x=>x.id==sel),g={Eggs:0,Chicken:0,Paneer:0};S.orders.forEach(o=>{if(o.sid==s.id&&!o.cancelled)if(catOf(o.item))g[catOf(o.item)]+=o.qty});
 return _sd6().replace('</div><h3>Add extras</h3>',`${Object.entries(g).map(([k,v])=>`<div class="box"><span>${k} given</span><b style="font-size:16px">${v}</b></div>`).join('')}</div><h3>Add extras</h3>`)};
const _o3=V.Orders;
V.Orders=function(ro){return _o3(ro).replace(/<td>([MW]\d{6})<\/td>/g,(m,id)=>`<td>${sinfo(id)}</td>`).replace(/<td>([MW]\d{6}) [^<]*<\/td>/g,(m,id)=>`<td>${sinfo(id)}</td>`).replace(/<th>Student<\/th>/g,'<th>Student details</th>')};
function stockBox(ro){const it=S.stock.filter(x=>x.h==viewH),e=it[0]&&it[0].name=='Eggss';
 return`<div class="box np" style="margin:8px 0"><h3 style="margin:0 0 4px">Insert eggs by tray</h3><div class="row"><label>Item<select id="si" onchange="sUnit()">${it.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label><label style="white-space:nowrap"><span id="sul">${e?'Number of trays':'Quantity ('+(it[0]?it[0].unit:'')+')'}</span><input id="sq" type="number" min="1" style="width:130px" oninput="sPrev()"></label><span id="sp" class="mute" style="align-self:center;white-space:nowrap">${e?'1 tray = '+TRAY+' eggs':''}</span><button class="b" id="sb" ${dis(ro)} onclick="stkAdd()">${e?'Insert tray':'Add stock'}</button></div></div>`}
const _bill3=V.Billing;
V.Billing=function(ro){const st=V.Stock(ro),tb=(st.match(/<div class="wrap"><table>[\s\S]*?<\/table><\/div>/)||[''])[0];
 return _bill3(ro)};
login();
</script></body></html>
